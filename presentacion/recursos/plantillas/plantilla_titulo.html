<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diapositiva de Título</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Poppins:wght@600;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0A2540;
            font-family: 'Open Sans', sans-serif;
            text-align: center;
        }

        .logo {
            /* Ruta relativa desde resultados/1.html hacia recursos/imagenes/ */
            max-width: 250px;
            margin-bottom: 50px;
        }

        h1.titulo-principal {
            font-family: 'Poppins', sans-serif;
            font-weight: 700; /* Bold */
            font-size: 48pt;
            color: #FFFFFF;
            margin: 0 0 15px 0;
            max-width: 80%;
            line-height: 1.2;
        }

        h2.subtitulo {
            font-family: 'Poppins', sans-serif;
            font-weight: 600; /* Semi-Bold */
            font-size: 32pt;
            color: #4CB5F5;
            margin: 0;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <img src="../recursos/imagenes/logo_.png" alt="Logo de la empresa" class="logo">
    <h1 class="titulo-principal">La IA explicada para escépticos</h1>
    <h2 class="subtitulo">Tecnológico, accesible, moderno y confiable</h2>
</body>
</html>
