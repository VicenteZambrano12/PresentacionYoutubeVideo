<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conclusión</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Poppins:wght@600;700&display=swap');
        
        body {
            margin: 0;
            padding: 50px 80px;
            box-sizing: border-box;
            height: 100vh;
            background-color: #F8F6F0;
            font-family: 'Open Sans', sans-serif;
            color: #1A1A1A;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 3px solid #4CB5F5;
            padding-bottom: 15px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1.titulo-diapositiva {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 28pt;
            color: #0A2540;
            margin: 0;
        }

        .logo-empresa {
            max-height: 60px;
            width: auto;
        }

        .contenido-principal {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .texto-conclusion {
            font-size: 24pt;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .logo-grande {
            max-width: 400px;
            height: auto;
            margin-bottom: 20px;
        }
        
        .texto-producto {
            font-size: 18pt;
            color: #4CB5F5;
            font-weight: bold;
        }

        footer {
            font-size: 12pt;
            color: #1A1A1A;
            border-top: 1px solid #0A2540;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="titulo-diapositiva">Conclusión</h1>
        <img src="../recursos/imagenes/logo_.png" alt="Logo pequeño" class="logo-empresa">
    </header>
    
    <div class="contenido-principal">
        <p class="texto-conclusion">Espero que te haya gustado este capítulo de historia. ¡Muchas gracias por atender! 😊</p>
        <img src="../recursos/imagenes/logo_letras.jpeg" alt="La IA explicada para escépticos Logo" class="logo-grande">
        <p class="texto-producto">Un producto de La IA explicada para escépticos</p>
    </div>
    
    <footer>
        <span>La IA explicada para escépticos</span>
        <span>Página 11</span>
    </footer>
</body>
</html>
