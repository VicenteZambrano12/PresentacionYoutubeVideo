<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diapositiva 10 - Divisor de Sección</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            background-color: #0A2540;
            padding-left: 100px;
            box-sizing: border-box;
        }

        .elemento-grafico {
            width: 150px;
            height: 8px;
            background-color: #4CB5F5;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        h1.titulo-seccion {
            font-family: 'Poppins', sans-serif;
            font-weight: 700; /* Bold */
            font-size: 40pt;
            color: #FFFFFF;
            margin: 0;
            max-width: 800px;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="elemento-grafico"></div>
    <h1 class="titulo-seccion">Conclusión</h1>
</body>
</html>
