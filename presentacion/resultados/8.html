<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diapositiva de Contenido</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Poppins:wght@600;700&display=swap');
        
        body {
            margin: 0;
            padding: 50px 80px;
            box-sizing: border-box;
            height: 100vh;
            background-color: #F8F6F0;
            font-family: 'Open Sans', sans-serif;
            color: #1A1A1A;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 3px solid #4CB5F5;
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1.titulo-diapositiva {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 28pt;
            color: #0A2540;
            margin: 0;
        }

        .logo-empresa {
            max-height: 60px;
            width: auto;
        }

        .contenido-principal {
            flex: 1;
            display: flex;
            gap: 40px;
            overflow: hidden;
        }

        .columna-mapas {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .mapa-item {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .mapa-item:last-child {
            margin-bottom: 0;
        }

        .titulo-mapa {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 18pt;
            color: #0A2540;
            margin: 0 0 10px 0;
        }

        .mapa-img {
            max-height: 150px;
            width: auto;
            border: 2px solid #4CB5F5;
            border-radius: 6px;
            object-fit: contain;
        }

        .columna-tabla {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tabla-img {
            max-width: 100%;
            max-height: 100%;
            border: 2px solid #0A2540;
            border-radius: 6px;
            object-fit: contain;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        footer {
            font-size: 12pt;
            color: #1A1A1A;
            border-top: 1px solid #0A2540;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="titulo-diapositiva">Extensión de Roma por Fases</h1>
        <img src="../recursos/imagenes/logo_.png" alt="Logo de la empresa" class="logo-empresa">
    </header>
    
    <div class="contenido-principal">
        <div class="columna-mapas">
            <div class="mapa-item">
                <h3 class="titulo-mapa">República</h3>
                <img src="../material/mapas/mapa_republica_201.jpeg" alt="Mapa de la República" class="mapa-img">
            </div>
            <div class="mapa-item">
                <h3 class="titulo-mapa">Final de la República</h3>
                <img src="../material/mapas/mapa_julio_cesar_44.jpeg" alt="Mapa del Final de la República" class="mapa-img">
            </div>
            <div class="mapa-item">
                <h3 class="titulo-mapa">Imperio</h3>
                <img src="../material/mapas/mapa_imperio_117.jpeg" alt="Mapa del Imperio" class="mapa-img">
            </div>
        </div>
        
        <div class="columna-tabla">
            <img src="../material/tablas_graficas/tabla_extension.png" alt="Tabla de Extensión Territorial" class="tabla-img">
        </div>
    </div>
    
    <footer>
        <span>La IA explicada para escépticos</span>
        <span>Página 7</span>
    </footer>
</body>
</html>
