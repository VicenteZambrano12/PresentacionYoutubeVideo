<!-- 7.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diapositiva de Contenido - Extensión de Roma en tres fases</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Poppins:wght@600;700&display=swap');
        
        body {
            margin: 0;
            padding: 50px 80px;
            box-sizing: border-box;
            height: 100vh;
            background-color: #F8F6F0;
            font-family: 'Open Sans', sans-serif;
            color: #1A1A1A;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 3px solid #4CB5F5;
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1.titulo-diapositiva {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 28pt;
            color: #0A2540;
            margin: 0;
        }

        .logo-empresa {
            max-height: 60px;
            width: auto;
        }

        .contenido-principal {
            flex: 1;
            display: flex;
            flex-direction: row;
            gap: 40px;
            min-height: 0; /* Crucial para que las imágenes no desborden el contenedor flexible */
        }

        .columna-mapas {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
            height: 100%;
        }

        .item-fase {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            min-height: 0;
            background-color: #FFFFFF;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .texto-periodo {
            flex: 0 0 45%;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 20pt;
            color: #0A2540;
        }

        .contenedor-imagen-mapa {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #4CB5F5;
        }

        .contenedor-imagen-mapa img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .columna-tabla {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            padding-left: 20px;
            border-left: 2px dashed #4CB5F5;
        }

        .columna-tabla img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        footer {
            font-size: 12pt;
            color: #1A1A1A;
            border-top: 1px solid #0A2540;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="titulo-diapositiva">Extensión de Roma en tres fases</h1>
        <img src="../recursos/imagenes/logo_.png" alt="Logo de la empresa" class="logo-empresa">
    </header>
    
    <div class="contenido-principal">
        <div class="columna-mapas">
            <div class="item-fase">
                <div class="texto-periodo">República</div>
                <div class="contenedor-imagen-mapa">
                    <img src="../material/fotos/escipion_africano.jpeg" alt="Fase República">
                </div>
            </div>
            <div class="item-fase">
                <div class="texto-periodo">Final de la República</div>
                <div class="contenedor-imagen-mapa">
                    <img src="../material/fotos/julio_cesar.jpeg" alt="Fase Final de la República">
                </div>
            </div>
            <div class="item-fase">
                <div class="texto-periodo">Imperio</div>
                <div class="contenedor-imagen-mapa">
                    <img src="../material/fotos/trajano._busto.jpeg" alt="Fase Imperio">
                </div>
            </div>
        </div>
        
        <div class="columna-tabla">
            <img src="../material/tablas_graficas/tabla_extension.png" alt="Tabla de Extensión">
        </div>
    </div>
    
    <footer>
        <span>La IA explicada para escépticos</span>
        <span>Página 7</span>
    </footer>
</body>
</html>
